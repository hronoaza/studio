structural_findings:
  - id: SF-PERMISSION-GOVERNANCE-BOUNDARY
    statement: >
      The ratified permission-evidence set directly governs the Studio Layer-D
      slice represented by EV-033. It does not govern adaptive-mesh C1 runtime
      implementation revisions; EV-003/004/005 are boundary/runtime substrates
      referenced by the design.

  - id: SF-GOV-CORE-COVERAGE
    statement: >
      The current Studio accepted-policy set does not expose an accepted
      normative policy contract owning the C1 core eligibility STOP semantics,
      A1 core freshness/revalidation semantics, or the underlying exact
      request-binding identity semantics implemented by adaptive-mesh.
      Candidate policy documents exist for freshness/revalidation and
      transition-request derivation. This is an accepted-policy coverage
      observation, not a runtime defect.

  - id: SF-C1-MIGRATION-STATE
    statement: >
      The canonical provenance migration record for C1 transition eligibility
      declares migration_stage=verified and acceptance_status=acceptance-pending,
      explicitly meaning not accepted into Current Baseline and requiring
      explicit acceptance before merge. Studio PR #5 nevertheless merged that
      migration into main at commit 400ccfa75f128644b648f36e179208923bad6eb5.
      This audit records the divergence between the provenance-recorded state
      and repository history without asserting that the state is or is not
      legitimate under Studio's governance model.

  - id: SF-ADAPTIVE-MESH-MAIN-PROTECTION
