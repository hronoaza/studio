schema: soam-evidence-matrix
version: 1
version_semantics: >
  Each matrix version records an audit view at its recorded date.
  Later matrix versions may refine or supersede audit interpretations,
  but they do not rewrite or replace the underlying policy, provenance,
  implementation, test, CI, or binding artifacts.

meta:
  recorded_date: 2026-09-24
  scope: >
    Cross-repository SOAM evidence, governance-coverage, verification,
    provenance, and boundary audit.
  materialization_role: audit
  canonical_audit_path: docs/audit/soam-evidence-matrix.yaml
  evidence_policy:
    - configured != passed
    - contract != implementation
    - implementation != verified execution
    - test target exists != test passed
    - CI workflow exists != CI green
    - documentation claim != implementation evidence
    - source observation != direct test verification
    - unknown values are null
  evidence_levels:
    E0: claim only
    E1: source or artifact identity established
    E2: verification mechanism exists/configured
    E3: exact execution passed and tied to revision
    E4: reproducible evidence bundle
  status_values:
    - implemented
    - partial
    - contract-only
    - configured
    - verified
    - gap
    - not-applicable
    - unverified_claim
  governance_state_values:
    - directly_governed
    - referenced_but_not_governed
    - without_governing_contract
    - contract_only
    - null

repositories:
  governance:
    repository: hronoaza/studio
    role:
      - governance
      - architecture / design contracts
      - provenance / ratification
      - isolated executable Layer-D permission verification slice
    executable_surfaces:
      - path: apps/soam-transition-permission
        role: D1/D3 verifier-only permission crypto slice
    head_at_materialization: 9f22bda38caee304d9ac3cbeed782cd3a2aa3c55

  runtime:
    repository: tonybarannn-maker/adaptive-mesh
    role:
      - SOAM C1/runtime substrate
      - eligibility
      - freshness / revalidation
      - relationship identity
      - authority-boundary machinery
      - packaging / consumer / benchmark verification surfaces
    head_at_materialization: 2866e3443445d3c423778131c1d6494e412a636d
    branch_protection:
      main_protected: false
      policy_bound: false

  research:
    repository: tonybarannn-maker/kiko-dna-lab
    role:
      - isolated research harness
    integration_boundary:
      soam_integration: NOT_AUTHORIZED
      future_integration_requires_explicit_gate: true

