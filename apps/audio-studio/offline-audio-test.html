<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HRONOAZA · Offline validation</title><link rel="stylesheet" href="./style.css">
<main><h1>Офлайн-тести</h1><p>Рендеринг у пам’ять. Відтворення через динаміки не запускається.</p><pre id="results" role="status">Виконання…</pre><a href="./index.html">До модуля</a></main>
<script type="module">
import {runTests} from './tests/offline-tests.js';
window.testDone = runTests().then(report => {
  document.querySelector('#results').textContent = JSON.stringify(report, null, 2);
  document.documentElement.dataset.result = report.failed ? 'fail' : 'pass';
  return report;
}).catch(error => {
  const report = {failed: 1, error: String(error.stack || error)};
  document.querySelector('#results').textContent = JSON.stringify(report, null, 2);
  document.documentElement.dataset.result = 'fail';
  return report;
});
</script></html>
